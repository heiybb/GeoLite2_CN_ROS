name: Update IP CIDR lists
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  build_lists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Linux update
        run: |
          sudo apt update
          sudo apt -y install file curl python3
      - name: Update
        run: bash update.sh
        env:
          IPINFO_TOKEN: ${{secrets.IPINFO_TOKEN}}
          # 隧道端点那个 /32。放 secret 里,GitHub 会在日志中打码;
          # 脚本本身也只打条数不打原文。
          EXCLUDE_CIDR: ${{secrets.EXCLUDE_CIDR}}
      - name: Commit
        run: |
          git diff
          git config --global user.name github-actions[bot]
          git config --global user.email github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Update GeoLite2_CN_ROS at $(date)" || exit 0
          git push origin main
      - run: echo "Done!"
